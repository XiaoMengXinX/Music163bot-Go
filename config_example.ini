# 以下为必填项
# 你的 Bot Token
BOT_TOKEN = YOUR_BOT_TOKEN

# 你的网易云 cookie 中 MUSIC_U 项的值（用于下载无损歌曲）
MUSIC_U = YOUR_MUSIC_U


# 以下为可选项
# 自定义 telegram bot API 地址
BotAPI = https://api.telegram.org

# 设置 bot 管理员 ID, 用 “," 分隔
BotAdmin = 115414,1919810

# 是否开启 bot 的 debug 功能
BotDebug = false

# 自定义 sqlite3 数据库文件 （默认为 cache.db）
Database = cache.db

# 设置日志等级 [panic|fatal|error|warn|info|debug|trace] (默认为 info)
LogLevel = info

# 是否开启自动更新 (默认开启）, 若设置为 false 相当于 -no-update 参数
AutoUpdate = true

# 下载文件损坏是否自动重新下载 (默认为 true)
AutoRetry = true

# 最大自动重试次数 (默认为 3)
MaxRetryTimes = 3

# 下载超时时长 (单位秒, 默认为 60)
DownloadTimeout = 60

# 自定义下载反向代理
ReverseProxy = 114.5.1.4:8080

# ===== 点播统计面板（可选）=====
# 是否启用面板（false 则完全关闭，不监听端口）
PanelEnable = true

# 面板监听地址（浏览器访问 http://<主机IP>:8099/）
# 建议只监听内网 / VPN 地址，例如 192.168.1.10:8099
PanelListen = 0.0.0.0:8099

# 访问认证方式：
#   token = 用 BotAdmin 里的账号私聊 bot 发送 /panel，用一次性令牌登录（默认）
#   none  = 不需要认证（仅在完全可信的内网里使用）
PanelAuth = token

# 一次性令牌有效期（秒，默认 300）
PanelTokenTTL = 300

# 面板对外的完整地址（可选）：填了之后 /panel 会直接给出可点击的一键登录链接
#PanelPublicURL = http://192.168.1.10:8099

# 统计数据库文件（独立于歌曲缓存库 cache.db，/rmcache 不会影响统计）
StatsDB = stats.db

# 统计时区，决定「按周统计」的周边界
StatsTimezone = Asia/Shanghai

# 仅启动面板与统计库、不连接 Telegram（离线调试面板用，正常运行时保持注释）
#PanelOnly = false